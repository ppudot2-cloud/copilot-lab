name: Good
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: good-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE"
