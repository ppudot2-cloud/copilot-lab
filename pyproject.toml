[project]
name = "solutionops"
version = "0.1.0"
description = "Tiny Power Platform solution-ops toolkit used as a GitHub Copilot learning lab"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=solutionops --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
