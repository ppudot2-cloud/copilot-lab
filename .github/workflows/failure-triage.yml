name: Failure Triage

# Captures a failed run at the moment it fails (logs expire later) and files or updates ONE
# issue per failure fingerprint. Add the workflows you want watched to `workflows:` below.
on:
  workflow_run:
    workflows: ["Demo Pipeline"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: failure-triage
  cancel-in-progress: false

jobs:
  triage:
    if: contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run executes with write tokens: check out the DEFAULT branch only, never the
      # head of the failed run, and treat log text as untrusted data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Capture, classify, file or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          gh run view "$RUN_ID" --repo "$REPO" --json databaseId,workflowName,headBranch,event,conclusion,startedAt,updatedAt,url,jobs > run.json
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > run.log || : > run.log
          python -m pipelineintel triage --run run.json --log run.log --json > triage.json
          FP=$(jq -r .fingerprint triage.json)
          jq -r .body triage.json > body.md
          gh label create pipeline-failure --repo "$REPO" --force >/dev/null
          EXISTING=$(gh issue list --repo "$REPO" --label pipeline-failure --state open \
            --search "$FP in:body" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" \
              --body "Recurred: $(jq -r .url run.json) (fingerprint \`$FP\`)"
          else
            gh issue create --repo "$REPO" --label pipeline-failure \
              --title "$(jq -r .title triage.json)" --body-file body.md
          fi
