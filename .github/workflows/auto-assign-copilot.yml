name: Auto-assign Copilot

# Label an issue `agent-ready` and Copilot's coding agent picks it up.
# Needs a repo secret COPILOT_ASSIGN_TOKEN (a PAT with issues:write); GITHUB_TOKEN cannot
# assign Copilot. Verify the assignee name against current docs if assignment fails.
on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: assign-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-assignee "@copilot"
