name: Auto-assign Copilot

# Automation lesson: label an issue `agent-ready` and Copilot's coding agent picks it up.
# Requires a repo secret COPILOT_ASSIGN_TOKEN (a PAT with issues:write); GITHUB_TOKEN
# cannot assign Copilot. Verify the assignee login against current docs if this fails.
on:
  issues:
    types: [labeled]

jobs:
  assign:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-assignee "@copilot"
