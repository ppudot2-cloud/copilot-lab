name: Workflow Audit

# Gap detection: weekly and on any PR that touches workflows. Findings land in the run summary.
on:
  pull_request:
    paths: [".github/workflows/**"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Audit (fail on high, report everything)
        run: |
          python -m pipelineintel audit .github/workflows --fail-on high | tee audit.md
          cat audit.md >> "$GITHUB_STEP_SUMMARY"
